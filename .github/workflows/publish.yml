name: Publish to PyPI

# 先手动发布 GitHub Release，
# Release published 后再构建、发 PyPI。
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies (uv.lock)
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Run tests
        run: uv run pytest -q -rs

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Verify release tag matches pyproject version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(uv version --short)"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject version $version"
            exit 1
          fi
          echo "Version matches: $TAG"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-parsehub
    permissions:
      id-token: write # PyPI Trusted Publishing（OIDC，不需要 API token）
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
